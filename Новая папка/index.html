<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>TapKi Ultimate</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --blue: #007AFF; --green: #34C759; --orange: #FF9500; --red: #FF3B30;
            --bg: #F2F2F7; --card: #FFFFFF; --text: #000000; --gray: #8E8E93;
            --safe-top: env(safe-area-inset-top); --safe-bottom: env(safe-area-inset-bottom);
        }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #000000; --card: #1C1C1E; --text: #FFFFFF; }
        }

        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }

        /* INTRO */
        #splash { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10000; transition: opacity 1s; }
        .splash-logo { font-size: 52px; font-weight: 800; letter-spacing: -2px; opacity: 0; transform: translateY(20px); animation: emerge 1.2s forwards cubic-bezier(0.2, 0.8, 0.2, 1); }
        @keyframes emerge { to { opacity: 1; transform: translateY(0); } }

        /* APP LAYOUT */
        #app { display: none; flex-direction: column; height: 100%; opacity: 0; transition: 1s; }
        header { padding: calc(var(--safe-top) + 20px) 20px 10px; background: var(--card); border-bottom: 0.5px solid rgba(0,0,0,0.1); }
        main { flex: 1; overflow-y: auto; padding: 15px 15px 120px; }
        .view { display: none; }
        .view.active { display: block; animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .card { background: var(--card); border-radius: 20px; padding: 18px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .ios-input { width: 100%; background: var(--bg); border: none; padding: 14px; border-radius: 12px; font-size: 16px; color: var(--text); margin-bottom: 10px; }
        .btn { background: var(--blue); color: white; border: none; padding: 14px; border-radius: 12px; width: 100%; font-weight: 600; }

        /* TASKS */
        .task-item { display: flex; align-items: center; padding: 14px 0; border-bottom: 0.5px solid rgba(142,142,147,0.2); }
        .cb { width: 26px; height: 26px; border: 2px solid var(--blue); border-radius: 50%; margin-right: 12px; position: relative; }
        .task-item.done .cb { background: var(--blue); }
        .task-item.done .cb::after { content: "✓"; color: white; position: absolute; left: 5px; top: 1px; }
        .task-item.done span { text-decoration: line-through; color: var(--gray); }
        .task-tag { font-size: 10px; color: var(--blue); margin-left: auto; text-transform: uppercase; font-weight: 700; }

        /* WEIGHT & BMI */
        .bmi-bar { height: 8px; border-radius: 4px; background: linear-gradient(to right, var(--green), var(--orange), var(--red)); margin: 15px 0; position: relative; }
        .bmi-dot { position: absolute; top: -4px; width: 4px; height: 16px; background: var(--text); border-radius: 2px; transition: 0.5s; }

        /* WORKOUT */
        .ex-header { display: flex; justify-content: space-between; align-items: center; }
        .hist { display: none; margin-top: 10px; padding-top: 10px; border-top: 0.5px solid rgba(0,0,0,0.1); font-size: 13px; color: var(--gray); }
        .hist.open { display: block; }

        /* NAV */
        nav { position: fixed; bottom: 0; width: 100%; height: calc(var(--safe-bottom) + 65px); background: rgba(var(--card-rgb), 0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); display: flex; justify-content: space-around; padding-top: 10px; border-top: 0.5px solid rgba(0,0,0,0.1); }
        .nav-btn { background: none; border: none; color: var(--gray); display: flex; flex-direction: column; align-items: center; font-size: 10px; }
        .nav-btn.active { color: var(--blue); }
        .nav-btn i { font-size: 24px; margin-bottom: 4px; font-style: normal; }
    </style>
</head>
<body>

    <div id="splash">
        <div class="splash-logo">TapKi</div>
    </div>

    <div id="app">
        <header>
            <div id="h-date" style="font-size: 12px; color: var(--gray); font-weight: 600;"></div>
            <h1 style="margin: 5px 0 0 0;">Мой день</h1>
        </header>

        <main>
            <section id="tab-tasks" class="view active">
                <div class="card">
                    <input type="text" id="t-in" class="ios-input" placeholder="Новая задача">
                    <select id="t-rep" class="ios-input">
                        <option value="once">Один раз</option>
                        <option value="daily">Ежедневно</option>
                        <option value="weekly">Еженедельно</option>
                    </select>
                    <button class="btn" onclick="addTask()">Добавить</button>
                </div>
                <div class="card" id="t-list"></div>
            </section>

            <section id="tab-weight" class="view">
                <div class="card"><canvas id="wChart" style="height:160px;"></canvas></div>
                <div class="card">
                    <div style="display:flex; justify-content:space-between; align-items:baseline;">
                        <h3>ИМТ: <span id="bmi-num">--</span></h3>
                        <span id="bmi-txt" style="font-size:14px; color:var(--gray)"></span>
                    </div>
                    <div class="bmi-bar"><div class="bmi-dot" id="bmi-dot"></div></div>
                </div>
                <div class="card">
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                        <input type="number" id="u-h" class="ios-input" placeholder="Рост (см)" onchange="updProfile()">
                        <input type="number" id="u-a" class="ios-input" placeholder="Возраст" onchange="updProfile()">
                    </div>
                    <div style="display:flex; gap:10px;">
                        <input type="number" step="0.1" id="w-in" class="ios-input" placeholder="Вес сегодня (кг)">
                        <button class="btn" style="width:80px" onclick="addW()">Ок</button>
                    </div>
                </div>
            </section>

            <section id="tab-workout" class="view">
                <div class="card">
                    <input type="text" id="ex-in" class="ios-input" placeholder="Название (жим, присед...)">
                    <button class="btn" onclick="addEx()">Создать</button>
                </div>
                <div id="ex-list"></div>
            </section>
        </main>

        <nav>
            <button class="nav-btn active" onclick="swTab('tasks', this)"><i>📋</i>План</button>
            <button class="nav-btn" onclick="swTab('weight', this)"><i>⚖️</i>Вес</button>
            <button class="nav-btn" onclick="swTab('workout', this)"><i>💪</i>Зал</button>
        </nav>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTick() {
            const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
            o.frequency.setValueAtTime(1000, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            o.connect(g); g.connect(audioCtx.destination);
            o.start(); o.stop(audioCtx.currentTime + 0.1);
        }

        let db = {
            tasks: JSON.parse(localStorage.getItem('tap_tasks')) || [],
            weight: JSON.parse(localStorage.getItem('tap_weight')) || [],
            profile: JSON.parse(localStorage.getItem('tap_prof')) || { h: 180, a: 25 },
            workout: JSON.parse(localStorage.getItem('tap_work')) || [],
            last: localStorage.getItem('tap_last') || ""
        };

        const save = () => {
            localStorage.setItem('tap_tasks', JSON.stringify(db.tasks));
            localStorage.setItem('tap_weight', JSON.stringify(db.weight));
            localStorage.setItem('tap_prof', JSON.stringify(db.profile));
            localStorage.setItem('tap_work', JSON.stringify(db.workout));
            localStorage.setItem('tap_last', db.last);
        };

        setTimeout(() => {
            document.getElementById('splash').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('splash').style.display = 'none';
                document.getElementById('app').style.display = 'flex';
                setTimeout(() => document.getElementById('app').style.opacity = '1', 50);
                init();
            }, 1000);
        }, 3000);

        function init() {
            const today = new Date().toDateString();
            if(db.last !== today) {
                db.tasks = db.tasks.filter(t => t.rep !== 'once' || !t.done);
                db.tasks.forEach(t => { if(t.rep !== 'once') t.done = false; });
                db.last = today; save();
            }
            document.getElementById('h-date').innerText = new Date().toLocaleDateString('ru-RU', {weekday:'long', day:'numeric', month:'short'});
            renderTasks(); renderProf(); renderEx(); initChart();
        }

        function swTab(id, btn) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('tab-'+id).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(n => n.classList.remove('active'));
            btn.classList.add('active');
            if(window.navigator.vibrate) window.navigator.vibrate(5);
        }

        function addTask() {
            const txt = document.getElementById('t-in').value;
            const rep = document.getElementById('t-rep').value;
            if(!txt) return;
            db.tasks.push({id: Date.now(), txt, rep, done: false});
            document.getElementById('t-in').value = '';
            save(); renderTasks();
        }

        function toggleTask(id) {
            const t = db.tasks.find(x => x.id === id);
            t.done = !t.done;
            if(t.done) { playTick(); if(window.navigator.vibrate) window.navigator.vibrate([15, 10, 15]); }
            save(); renderTasks();
        }

        function renderTasks() {
            const l = document.getElementById('t-list');
            l.innerHTML = db.tasks.map(t => `
                <div class="task-item ${t.done ? 'done' : ''}" onclick="toggleTask(${t.id})">
                    <div class="cb"></div><span>${t.txt}</span>
                    <div class="task-tag">${t.rep === 'daily' ? 'День' : (t.rep === 'weekly' ? 'Неделя' : '')}</div>
                </div>
            `).join('') || '<div style="text-align:center; color:var(--gray)">План пуст</div>';
        }

        function updProfile() {
            db.profile.h = document.getElementById('u-h').value;
            db.profile.a = document.getElementById('u-a').value;
            save(); renderProf();
        }

        function addW() {
            const v = parseFloat(document.getElementById('w-in').value);
            if(!v) return;
            db.weight.push({d: new Date().toLocaleDateString('ru-RU', {day:'2-digit', month:'2-digit'}), v});
            if(db.weight.length > 15) db.weight.shift();
            document.getElementById('w-in').value = '';
            save(); renderProf(); updChart();
        }

        function renderProf() {
            document.getElementById('u-h').value = db.profile.h;
            document.getElementById('u-a').value = db.profile.a;
            if(db.weight.length > 0) {
                const w = db.weight[db.weight.length-1].v;
                const bmi = (w / ((db.profile.h/100)**2)).toFixed(1);
                document.getElementById('bmi-num').innerText = bmi;
                let s = "Норма", p = 40;
                if(bmi < 18.5) { s = "Дефицит"; p = 15; }
                else if(bmi > 25) { s = "Избыток"; p = 75; }
                document.getElementById('bmi-txt').innerText = s;
                document.getElementById('bmi-dot').style.left = p + '%';
            }
        }

        let chart;
        function initChart() {
            const ctx = document.getElementById('wChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'line',
                data: { labels: db.weight.map(x=>x.d), datasets: [{ data: db.weight.map(x=>x.v), borderColor: '#007AFF', tension: 0.4, fill: false }] },
                options: { plugins: { legend: { display: false } }, scales: { x: { display: false } } }
            });
        }
        function updChart() { chart.data.labels = db.weight.map(x=>x.d); chart.data.datasets[0].data = db.weight.map(x=>x.v); chart.update(); }

        function addEx() {
            const n = document.getElementById('ex-in').value;
            if(!n) return;
            db.workout.push({id: Date.now(), n, hist: []});
            document.getElementById('ex-in').value = '';
            save(); renderEx();
        }

        function addSet(id) {
            const ex = db.workout.find(x => x.id === id);
            const isJ = ex.n.toLowerCase().includes('жим');
            let w = isJ ? prompt("Вес (кг):") : 0;
            let r = prompt("Повторы:");
            if(r) { ex.hist.unshift({d: new Date().toLocaleDateString(), w, r}); save(); renderEx(); }
        }

        function renderEx() {
            const l = document.getElementById('ex-list');
            l.innerHTML = db.workout.map(e => `
                <div class="card">
                    <div class="ex-header">
                        <div onclick="document.getElementById('h-${e.id}').classList.toggle('open')">
                            <div style="font-weight:700">${e.n}</div>
                            <div style="font-size:12px; color:var(--blue)">История ▾</div>
                        </div>
                        <button class="btn" style="width:50px; padding:8px" onclick="addSet(${e.id})">+</button>
                    </div>
                    <div class="hist" id="h-${e.id}">
                        ${e.hist.map(h => `<div>${h.d}: ${h.w ? h.w+'кг x ' : ''}${h.r} повт.</div>`).join('') || 'Пусто'}
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
