<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>TapKi Ultimate Pro</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --blue: #007AFF; --green: #34C759; --orange: #FF9500; --red: #FF3B30;
            --bg: #F2F2F7; --card: #FFFFFF; --text: #000000; --gray: #8E8E93;
            --safe-top: env(safe-area-inset-top); --safe-bottom: env(safe-area-inset-bottom);
        }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #000000; --card: #1C1C1E; --text: #FFFFFF; }
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; background: var(--bg); color: var(--text); 
            height: 100vh; overflow: hidden; 
        }

        /* --- ОБНОВЛЕННЫЙ SPLASH --- */
        #splash { 
            position: fixed; inset: 0; background: var(--bg); 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            z-index: 10000; transition: opacity 0.8s ease-out; 
        }
        .splash-logo { 
            font-size: 56px; font-weight: 800; letter-spacing: -3px; 
            opacity: 0; transform: scale(0.8);
            animation: logoIn 1s forwards cubic-bezier(0.17, 0.67, 0.83, 0.67);
        }
        .splash-sub { 
            font-size: 16px; color: var(--gray); margin-top: 15px; 
            opacity: 0; transform: translateY(10px);
            animation: subIn 1s 0.8s forwards ease-out;
        }
        @keyframes logoIn { to { opacity: 1; transform: scale(1); } }
        @keyframes subIn { to { opacity: 1; transform: translateY(0); } }

        /* --- LAYOUT --- */
        #app { display: none; flex-direction: column; height: 100%; opacity: 0; transition: 1s; }
        header { padding: calc(var(--safe-top) + 20px) 20px 15px; background: var(--card); border-bottom: 0.5px solid rgba(0,0,0,0.1); }
        main { flex: 1; overflow-y: auto; padding: 20px 15px 140px; }
        .view { display: none; animation: slideUp 0.4s cubic-bezier(0.25, 0.1, 0.25, 1); }
        .view.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        /* --- КОМПОНЕНТЫ --- */
        .card { background: var(--card); border-radius: 22px; padding: 20px; margin-bottom: 20px; box-shadow: 0 5px 20px rgba(0,0,0,0.04); border: 0.5px solid rgba(0,0,0,0.05); }
        .ios-input { 
            width: 100%; background: var(--bg); border: none; padding: 16px; border-radius: 14px; 
            font-size: 17px; color: var(--text); margin-bottom: 12px; box-sizing: border-box;
        }
        .btn { 
            background: var(--blue); color: white; border: none; padding: 16px; border-radius: 14px; 
            width: 100%; font-weight: 600; font-size: 17px; active { transform: scale(0.97); } transition: 0.2s;
        }

        /* Краткая сводка (моя фишка) */
        .summary-card { background: var(--blue); color: white; display: flex; justify-content: space-between; align-items: center; }
        .summary-info h4 { margin: 0; font-size: 14px; opacity: 0.8; text-transform: uppercase; letter-spacing: 1px; }
        .summary-info div { font-size: 24px; font-weight: 700; margin-top: 4px; }

        /* TASKS */
        .task-item { display: flex; align-items: center; padding: 16px 0; border-bottom: 0.5px solid rgba(142,142,147,0.2); }
        .cb { width: 28px; height: 28px; border: 2px solid var(--blue); border-radius: 50%; margin-right: 14px; position: relative; transition: 0.3s; }
        .task-item.done .cb { background: var(--blue); transform: scale(1.1); }
        .task-item.done .cb::after { content: "✓"; color: white; position: absolute; left: 6px; top: 2px; font-weight: 800; }
        .task-item.done span { text-decoration: line-through; color: var(--gray); transition: 0.3s; }
        .task-tag { font-size: 11px; color: var(--blue); margin-left: auto; background: rgba(0,122,255,0.1); padding: 4px 8px; border-radius: 6px; font-weight: 700; }

        /* BMI METER */
        .bmi-bar { height: 10px; border-radius: 5px; background: linear-gradient(to right, var(--green), var(--orange), var(--red)); margin: 20px 0 10px; position: relative; }
        .bmi-dot { position: absolute; top: -5px; width: 6px; height: 20px; background: var(--text); border-radius: 3px; border: 2px solid var(--card); transition: 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        /* NAV */
        nav { 
            position: fixed; bottom: 0; width: 100%; height: calc(var(--safe-bottom) + 75px); 
            background: rgba(var(--card-rgb), 0.85); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); 
            display: flex; justify-content: space-around; padding-top: 12px; border-top: 0.5px solid rgba(0,0,0,0.1); z-index: 1000;
        }
        .nav-btn { background: none; border: none; color: var(--gray); display: flex; flex-direction: column; align-items: center; font-size: 11px; transition: 0.3s; }
        .nav-btn.active { color: var(--blue); transform: translateY(-2px); }
        .nav-btn i { font-size: 26px; margin-bottom: 5px; font-style: normal; }
    </style>
</head>
<body>

    <div id="splash">
        <div class="splash-logo">TapKi</div>
        <div class="splash-sub">День начинается с TapKi</div>
    </div>

    <div id="app">
        <header>
            <div id="h-date" style="font-size: 13px; color: var(--gray); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;"></div>
            <h1 style="margin: 5px 0 0 0; font-size: 34px; font-weight: 800;">Мой день</h1>
        </header>

        <main>
            <section id="tab-tasks" class="view active">
                <div class="card summary-card">
                    <div class="summary-info">
                        <h4>Задачи на сегодня</h4>
                        <div id="summary-task-count">0 из 0 выполнено</div>
                    </div>
                    <div style="font-size: 32px;">🎯</div>
                </div>

                <div class="card">
                    <h3 style="margin-top:0">Новая задача</h3>
                    <input type="text" id="t-in" class="ios-input" placeholder="Что нужно сделать?">
                    <select id="t-rep" class="ios-input">
                        <option value="once">Только сегодня</option>
                        <option value="daily">Каждый день</option>
                        <option value="weekly">Раз в неделю</option>
                    </select>
                    <button class="btn" onclick="addTask()">Добавить в список</button>
                </div>
                <div class="card" id="t-list" style="padding: 10px 20px;"></div>
            </section>

            <section id="tab-weight" class="view">
                <div class="card"><canvas id="wChart" style="height:180px; width: 100%;"></canvas></div>
                
                <div class="card">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <h3 style="margin:0">ИМТ: <span id="bmi-num" style="color:var(--blue)">--</span></h3>
                        <span id="bmi-txt" style="font-weight:700; background: var(--bg); padding: 4px 10px; border-radius: 8px;">--</span>
                    </div>
                    <div class="bmi-bar"><div class="bmi-dot" id="bmi-dot"></div></div>
                </div>

                <div class="card">
                    <h3 style="margin-top:0">Мои данные</h3>
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px; margin-bottom: 5px;">
                        <div>
                            <label style="font-size: 12px; color: var(--gray); margin-left: 5px;">Рост (см)</label>
                            <input type="number" id="u-h" class="ios-input" placeholder="180" onchange="updProfile()">
                        </div>
                        <div>
                            <label style="font-size: 12px; color: var(--gray); margin-left: 5px;">Возраст</label>
                            <input type="number" id="u-a" class="ios-input" placeholder="25" onchange="updProfile()">
                        </div>
                    </div>
                    <div style="display:flex; gap:12px; align-items: flex-end;">
                        <div style="flex:1">
                            <label style="font-size: 12px; color: var(--gray); margin-left: 5px;">Текущий вес (кг)</label>
                            <input type="number" step="0.1" id="w-in" class="ios-input" placeholder="75.5" style="margin-bottom:0">
                        </div>
                        <button class="btn" style="width:70px; height: 50px;" onclick="addW()">Ок</button>
                    </div>
                </div>
            </section>

            <section id="tab-workout" class="view">
                <div class="card">
                    <h3 style="margin-top:0">Новое упражнение</h3>
                    <input type="text" id="ex-in" class="ios-input" placeholder="Название (жим, присед...)">
                    <button class="btn" onclick="addEx()">Добавить упражнение</button>
                </div>
                <div id="ex-list"></div>
            </section>
        </main>

        <nav>
            <button class="nav-btn active" onclick="swTab('tasks', this)"><i>📋</i>План</button>
            <button class="nav-btn" onclick="swTab('weight', this)"><i>⚖️</i>Вес</button>
            <button class="nav-btn" onclick="swTab('workout', this)"><i>💪</i>Зал</button>
        </nav>
    </div>

    <script>
        // --- ЗВУК ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTick() {
            const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
            o.frequency.setValueAtTime(1200, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            o.connect(g); g.connect(audioCtx.destination);
            o.start(); o.stop(audioCtx.currentTime + 0.1);
        }

        // --- ДАННЫЕ ---
        let db = {
            tasks: JSON.parse(localStorage.getItem('tap_tasks')) || [],
            weight: JSON.parse(localStorage.getItem('tap_weight')) || [],
            profile: JSON.parse(localStorage.getItem('tap_prof')) || { h: 180, a: 25 },
            workout: JSON.parse(localStorage.getItem('tap_work')) || [],
            last: localStorage.getItem('tap_last') || ""
        };

        const save = () => {
            localStorage.setItem('tap_tasks', JSON.stringify(db.tasks));
            localStorage.setItem('tap_weight', JSON.stringify(db.weight));
            localStorage.setItem('tap_prof', JSON.stringify(db.profile));
            localStorage.setItem('tap_work', JSON.stringify(db.workout));
            localStorage.setItem('tap_last', db.last);
            updateSummary();
        };

        // --- SPLASH ---
        setTimeout(() => {
            document.getElementById('splash').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('splash').style.display = 'none';
                document.getElementById('app').style.display = 'flex';
                setTimeout(() => document.getElementById('app').style.opacity = '1', 50);
                init();
            }, 800);
        }, 3200);

        function init() {
            const today = new Date().toDateString();
            if(db.last !== today) {
                db.tasks = db.tasks.filter(t => t.rep !== 'once' || !t.done);
                db.tasks.forEach(t => { if(t.rep !== 'once') t.done = false; });
                db.last = today; save();
            }
            document.getElementById('h-date').innerText = new Date().toLocaleDateString('ru-RU', {weekday:'long', day:'numeric', month:'short'});
            renderTasks(); renderProf(); renderEx(); initChart(); updateSummary();
        }

        function swTab(id, btn) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('tab-'+id).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(n => n.classList.remove('active'));
            btn.classList.add('active');
            if(window.navigator.vibrate) window.navigator.vibrate(10);
        }

        function addTask() {
            const txt = document.getElementById('t-in').value;
            const rep = document.getElementById('t-rep').value;
            if(!txt) return;
            db.tasks.push({id: Date.now(), txt, rep, done: false});
            document.getElementById('t-in').value = '';
            save(); renderTasks();
        }

        function toggleTask(id) {
            const t = db.tasks.find(x => x.id === id);
            t.done = !t.done;
            if(t.done) { playTick(); if(window.navigator.vibrate) window.navigator.vibrate([15, 10, 15]); }
            save(); renderTasks();
        }

        function renderTasks() {
            const l = document.getElementById('t-list');
            l.innerHTML = db.tasks.map(t => `
                <div class="task-item ${t.done ? 'done' : ''}" onclick="toggleTask(${t.id})">
                    <div class="cb"></div><span>${t.txt}</span>
                    <div class="task-tag">${t.rep === 'daily' ? 'День' : (t.rep === 'weekly' ? 'Неделя' : 'Разово')}</div>
                </div>
            `).join('') || '<div style="text-align:center; color:var(--gray); padding: 20px;">Задач пока нет</div>';
        }

        function updateSummary() {
            const total = db.tasks.length;
            const done = db.tasks.filter(t => t.done).length;
            document.getElementById('summary-task-count').innerText = `${done} из ${total} выполнено`;
        }

        function updProfile() {
            db.profile.h = document.getElementById('u-h').value;
            db.profile.a = document.getElementById('u-a').value;
            save(); renderProf();
        }

        function addW() {
            const v = parseFloat(document.getElementById('w-in').value);
            if(!v) return;
            db.weight.push({d: new Date().toLocaleDateString('ru-RU', {day:'2-digit', month:'2-digit'}), v});
            if(db.weight.length > 15) db.weight.shift();
            document.getElementById('w-in').value = '';
            save(); renderProf(); updChart();
        }

        function renderProf() {
            document.getElementById('u-h').value = db.profile.h;
            document.getElementById('u-a').value = db.profile.a;
            if(db.weight.length > 0) {
                const w = db.weight[db.weight.length-1].v;
                const bmi = (w / ((db.profile.h/100)**2)).toFixed(1);
                document.getElementById('bmi-num').innerText = bmi;
                let s = "Норма", p = 40;
                if(bmi < 18.5) { s = "Дефицит"; p = 15; }
                else if(bmi >= 25 && bmi < 30) { s = "Лишний вес"; p = 65; }
                else if(bmi >= 30) { s = "Ожирение"; p = 90; }
                document.getElementById('bmi-txt').innerText = s;
                document.getElementById('bmi-dot').style.left = p + '%';
            }
        }

        let chart;
        function initChart() {
            const ctx = document.getElementById('wChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'line',
                data: { labels: db.weight.map(x=>x.d), datasets: [{ data: db.weight.map(x=>x.v), borderColor: '#007AFF', tension: 0.4, fill: true, backgroundColor: 'rgba(0,122,255,0.1)', pointRadius: 5 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { display: true }, y: { display: true } } }
            });
        }
        function updChart() { chart.data.labels = db.weight.map(x=>x.d); chart.data.datasets[0].data = db.weight.map(x=>x.v); chart.update(); }

        function addEx() {
            const n = document.getElementById('ex-in').value;
            if(!n) return;
            db.workout.push({id: Date.now(), n, hist: []});
            document.getElementById('ex-in').value = '';
            save(); renderEx();
        }

        function addSet(id) {
            const ex = db.workout.find(x => x.id === id);
            const isJ = ex.n.toLowerCase().includes('жим');
            let w = isJ ? prompt("Введите вес (кг):") : 0;
            let r = prompt("Введите количество повторений:");
            if(r) { ex.hist.unshift({d: new Date().toLocaleDateString(), w, r}); save(); renderEx(); }
        }

        function renderEx() {
            const l = document.getElementById('ex-list');
            l.innerHTML = db.workout.map(e => `
                <div class="card">
                    <div class="ex-header">
                        <div onclick="document.getElementById('h-${e.id}').classList.toggle('open')">
                            <div style="font-weight:700; font-size:18px;">${e.n}</div>
                            <div style="font-size:13px; color:var(--blue); margin-top:2px;">История ▾</div>
                        </div>
                        <button class="btn" style="width:55px; padding:10px" onclick="addSet(${e.id})">+</button>
                    </div>
                    <div class="hist" id="h-${e.id}" style="display:none; margin-top:15px; border-top: 0.5px solid rgba(0,0,0,0.1); padding-top:10px;">
                        ${e.hist.map(h => `<div style="display:flex; justify-content:space-between; margin-bottom:5px; font-size:13px; color:var(--gray);"><span>${h.d}</span><b>${h.w ? h.w+'кг x ' : ''}${h.r} повт.</b></div>`).join('') || 'Записей нет'}
                    </div>
                </div>
            `).join('');
            
            // Фикс для открытия истории
            document.querySelectorAll('.hist').forEach(h => {
                h.parentElement.querySelector('.ex-header div').onclick = () => {
                    h.style.display = h.style.display === 'none' ? 'block' : 'none';
                }
            });
        }
    </script>
</body>
</html>
