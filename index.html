<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>TapKi — Мульти-трекер</title>

<!-- iOS home-screen & icon -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon.png">

<style>
:root{
  --bg: #fbfdff;
  --card: #ffffff;
  --muted: #7b8090;
  --accent: #2b8cff;
  --accent2: #2dd4bf;
  --ok: #2ecc71;
  --danger: #ff6b6b;
  font-family: Inter, system-ui, -apple-system, "Helvetica Neue", Arial;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:linear-gradient(180deg,#f6f8fb,#ffffff);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
.app{max-width:980px;margin:0 auto;padding:18px;padding-bottom:96px} /* bottom nav space */

/* header */
header.app-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:48px;height:48px;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(34,60,80,0.06)}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.title{font-weight:700;font-size:16px}
.subtitle{font-size:12px;color:var(--muted)}

/* main card and controls */
.card{background:var(--card);border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:0 8px 30px rgba(16,24,40,0.04)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:0;padding:10px 14px;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer;min-height:44px;line-height:1}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid rgba(43,140,255,0.12)}
.icon-btn{background:transparent;border:0;padding:8px;border-radius:12px;cursor:pointer;min-height:44px}
.small{font-size:13px;color:var(--muted)}
.input{padding:10px 12px;border-radius:10px;border:1px solid #e7eefb;min-width:120px;background:#fff;min-height:44px}
.flex-1{flex:1}

/* bottom nav (mobile-friendly) */
.navbar{position:fixed;left:8px;right:8px;bottom:10px;display:flex;justify-content:center;padding:6px;pointer-events:auto;z-index:999}
.nav-inner{background:rgba(255,255,255,0.95);backdrop-filter:blur(8px);border-radius:18px;padding:8px 12px;display:flex;gap:6px;box-shadow:0 14px 40px rgba(16,24,40,0.08);padding-bottom:calc(env(safe-area-inset-bottom) + 10px)}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 12px;border-radius:12px;cursor:pointer;color:var(--muted);font-size:13px;min-width:56px;min-height:48px}
.tab.active{background:linear-gradient(180deg, rgba(43,140,255,0.08), rgba(45,212,191,0.03));color:var(--accent);box-shadow:0 6px 18px rgba(43,140,255,0.08)}
.section{display:none}
.section.active{display:block}

/* tasks */
.task{display:flex;align-items:center;gap:8px;padding:10px;border-radius:12px;border:1px solid #f1f3f6;margin-bottom:8px;background:#fff}
.task .title{flex:1}
.checkbox{width:22px;height:22px;border-radius:8px;border:1px solid #e2e8f0;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}

/* finance columns */
.columns{display:flex;gap:8px;align-items:end;overflow:auto;padding:8px 6px}
.col{width:30px;border-radius:8px;background:linear-gradient(180deg,#eaf6ff,#fff);position:relative;display:flex;align-items:flex-end;justify-content:center;cursor:pointer;min-height:40px}
.col .fill{width:100%;border-radius:8px 8px 6px 6px;background:linear-gradient(180deg,var(--accent),var(--accent2));transition:height .4s}
.col.done .fill{background:linear-gradient(180deg,var(--ok),#12a85b)}
.col .label{position:absolute;top:-22px;font-size:11px;color:var(--muted);white-space:nowrap}

/* weight */
.weight-chart{height:120px;padding:8px;border-radius:10px;background:linear-gradient(180deg,#fff,#fbfdff);display:flex;align-items:center;justify-content:center}
.sparkline{width:100%;height:100%}

/* timeline */
.timeline{display:flex;flex-direction:column;gap:8px}
.event{background:#fff;padding:10px;border-radius:10px;border:1px solid #f1f4f9;display:flex;gap:8px;align-items:flex-start}
.event .time{font-size:12px;color:var(--muted);min-width:86px}

/* responsive */
@media (max-width:560px){
  .logo{width:40px;height:40px}
  .title{font-size:15px}
  .col{width:22px}
  .input{min-width:90px}
  .tab{font-size:12px;min-width:48px}
}
</style>
</head>
<body>

<!-- SPLASH (3 seconds) -->
<div id="splash" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:9999;background:#fff">
  <div id="splashCard" style="width:140px;height:140px;border-radius:20px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 20px 60px rgba(34,60,80,0.08)">
    <!-- will be replaced by uploaded logo if any -->
    <svg id="splashDefault" viewBox="0 0 64 64" width="64" height="64" xmlns="http://www.w3.org/2000/svg">
      <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#1f8cff"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient></defs>
      <rect rx="12" width="64" height="64" fill="url(#g)"/>
      <g transform="translate(14,18)" fill="#fff">
        <rect x="0" y="0" width="8" height="24"/><circle cx="28" cy="8" r="8"/>
      </g>
    </svg>
  </div>
  <div style="margin-top:16px;font-weight:700;font-size:18px">TapKi</div>
</div>

<div class="app" id="app" style="display:none">
  <header class="app-header">
    <div class="brand">
      <div class="logo" id="logoSmall">
        <svg viewBox="0 0 64 64" width="32" height="32" xmlns="http://www.w3.org/2000/svg">
          <defs><linearGradient id="g2" x1="0" x2="1"><stop offset="0" stop-color="#1f8cff"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient></defs>
          <rect rx="10" width="64" height="64" fill="url(#g2)"/>
          <g transform="translate(12,16)" fill="#fff"><rect x="0" y="0" width="8" height="24"/><circle cx="28" cy="8" r="8"/></g>
        </svg>
      </div>
      <div>
        <div class="title">TapKi</div>
        <div class="subtitle" id="subtitle">Трекер</div>
      </div>
    </div>

    <div class="row">
      <button class="icon-btn" id="btnExport" title="Экспорт">⬇️</button>
      <button class="icon-btn" id="btnImport" title="Импорт">⬆️</button>
      <input id="logoFile" type="file" accept="image/*" style="display:none">
      <button class="icon-btn" id="btnLogo" title="Логотип">🖼️</button>
      <button class="icon-btn" id="btnReset" title="Сброс">♻️</button>
    </div>
  </header>

  <main>
    <!-- WORKOUTS -->
    <section id="workouts" class="section">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div style="font-weight:700">Тренировки</div>
          <div class="small">Стрик: <span id="workout-streak">0</span></div>
        </div>
        <div style="height:10px"></div>
        <div class="row" style="align-items:center">
          <input id="workoutName" class="input" placeholder="Название">
          <input id="workoutDuration" class="input" type="number" placeholder="мин" style="width:84px">
          <input id="workoutCalories" class="input" type="number" placeholder="ккал" style="width:84px">
          <button class="btn" id="addWorkout">Добавить</button>
        </div>
        <div style="height:12px"></div>
        <div id="workoutList"></div>
      </div>
    </section>

    <!-- WEIGHT -->
    <section id="weight" class="section">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div style="font-weight:700">Вес & ИМТ</div>
          <div class="small" id="bmiText">—</div>
        </div>
        <div style="height:10px"></div>
        <div class="row">
          <input id="inputWeight" class="input" placeholder="Вес, кг" type="number" step="0.1">
          <input id="inputHeight" class="input" placeholder="Рост, см" type="number" step="0.1">
          <button class="btn" id="addWeight">Сохранить</button>
          <button class="btn ghost" id="clearWeights">Очистить</button>
        </div>
        <div style="height:12px"></div>
        <div class="weight-chart card" id="weightChart">
          <svg class="sparkline" id="weightSpark" viewBox="0 0 400 120" preserveAspectRatio="none"></svg>
        </div>
        <div style="height:10px"></div>
        <table class="table">
          <thead><tr><th>Дата</th><th>Вес</th><th>ИМТ</th><th></th></tr></thead>
          <tbody id="weightsTable"></tbody>
        </table>
      </div>
    </section>

    <!-- TASKS -->
    <section id="tasks" class="section">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div style="font-weight:700">Задачи</div>
          <div>
            <select id="taskFilter" class="input">
              <option value="all">Все</option>
              <option value="today">Сегодня</option>
              <option value="active">Активные</option>
              <option value="done">Выполнено</option>
            </select>
          </div>
        </div>
        <div style="height:10px"></div>
        <div class="row">
          <input id="taskTitle" class="input flex-1" placeholder="Новая задача">
          <input id="taskDue" class="input" type="date">
          <button class="btn" id="addTask">Добавить</button>
        </div>
        <div style="height:12px"></div>
        <div id="taskList"></div>
      </div>
    </section>

    <!-- FINANCES -->
    <section id="finances" class="section">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div style="font-weight:700">Финансы</div>
          <div class="small" id="finSummary">0 / 0 / 0</div>
        </div>
        <div style="height:10px"></div>
        <div class="row">
          <select id="txnType" class="input" style="width:120px">
            <option value="income">Доход</option>
            <option value="expense">Расход</option>
          </select>
          <input id="txnAmount" class="input" type="number" placeholder="₽">
          <input id="txnNote" class="input flex-1" placeholder="Описание">
          <button class="btn" id="addTxn">Записать</button>
        </div>
        <div style="height:12px"></div>
        <div style="display:flex;gap:12px;align-items:flex-end">
          <div style="flex:1">
            <div class="small">Последние 30 дней</div>
            <div class="columns" id="financeCols"></div>
          </div>
          <div style="width:220px">
            <div class="small">Текущий баланс</div>
            <div style="font-weight:700;font-size:20px" id="balance">0 ₽</div>
            <div style="height:8px"></div>
            <div class="small">Цель в месяц</div>
            <input id="goalMonthly" class="input" type="number" placeholder="₽">
            <div style="height:8px"></div>
            <button class="btn" id="setGoal">Сохранить цель</button>
          </div>
        </div>
        <div style="height:12px"></div>
        <table class="table">
          <thead><tr><th>Дата</th><th>Тип</th><th>Сумма</th><th>Примечание</th></tr></thead>
          <tbody id="txnTable"></tbody>
        </table>
      </div>
    </section>

    <!-- HISTORY -->
    <section id="history" class="section active">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div style="font-weight:700">История</div>
          <div class="small">Экспорт/Импорт для бекапа</div>
        </div>
        <div style="height:10px"></div>
        <div class="timeline" id="timeline"></div>
      </div>
    </section>
  </main>

  <!-- bottom nav -->
  <div class="navbar" role="navigation" aria-label="Навигация">
    <div class="nav-inner" id="navInner">
      <div class="tab active" data-tab="history">📊<div>История</div></div>
      <div class="tab" data-tab="workouts">🏋️<div>Трен</div></div>
      <div class="tab" data-tab="weight">⚖️<div>Вес</div></div>
      <div class="tab" data-tab="tasks">✅<div>Задачи</div></div>
      <div class="tab" data-tab="finances">💰<div>Деньги</div></div>
    </div>
  </div>

  <input type="file" id="importFile" accept="application/json" style="display:none">
</div>

<script>
/* ===== STORAGE ===== */
const STORE_KEY = 'tapki_v2';
let store = {
  workouts: [], weights: [], tasks: [], txns: [], settings: {height:170, iconData:null, goalMonthly:0}, logs: []
};
function load(){ try{ const s = localStorage.getItem(STORE_KEY); if(s) store = JSON.parse(s); }catch(e){console.error(e)} }
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(store)); renderAll(); }
function uid(pref='id'){ return pref + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8); }
function now(){ return Date.now(); }
function fmtDate(ts){ const d = new Date(ts); return d.toLocaleString('ru-RU',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}); }
function dateOnly(ts){ const d = new Date(ts); return d.toISOString().slice(0,10); }
function addLog(type, text, meta){ store.logs.unshift({id:uid('log'), t:now(), type, text, meta}); if(store.logs.length>400) store.logs.pop(); save(); }

/* ===== SPLASH (3s) & LOGO APPLY ===== */
const splash = document.getElementById('splash');
const app = document.getElementById('app');
const logoFile = document.getElementById('logoFile');
const btnLogo = document.getElementById('btnLogo');
const logoSmall = document.getElementById('logoSmall');
const splashCard = document.getElementById('splashCard');

btnLogo.addEventListener('click', ()=> logoFile.click());
logoFile.addEventListener('change', (e)=>{
  const f = e.target.files && e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{ store.settings.iconData = r.result; save(); applyLogo(r.result); };
  r.readAsDataURL(f);
});
function applyLogo(dataUrl){
  logoSmall.innerHTML = ''; splashCard.innerHTML = '';
  const i = document.createElement('img'); i.src=dataUrl; i.alt='logo'; i.style.width='100%'; i.style.height='100%'; i.style.objectFit='cover';
  logoSmall.appendChild(i);
  splashCard.appendChild(i.cloneNode());
}

/* ===== NAV ===== */
const tabs = document.querySelectorAll('.tab');
tabs.forEach(t => t.addEventListener('click', ()=>{
  tabs.forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById(t.dataset.tab).classList.add('active');
}));

/* ===== WORKOUTS ===== */
const workoutList = document.getElementById('workoutList');
document.getElementById('addWorkout').addEventListener('click', ()=>{
  const name = document.getElementById('workoutName').value.trim();
  const dur = Number(document.getElementById('workoutDuration').value) || 0;
  const kcal = Number(document.getElementById('workoutCalories').value) || 0;
  if(!name) return alert('Введите название');
  const item = {id:uid('w'), name, dur, kcal, date:now()};
  store.workouts.unshift(item);
  addLog('workout', `Тренировка: ${name} ${dur}мин ${kcal}ккал`, item);
  document.getElementById('workoutName').value=''; document.getElementById('workoutDuration').value=''; document.getElementById('workoutCalories').value='';
  save();
});
function renderWorkouts(){
  workoutList.innerHTML='';
  if(store.workouts.length===0) workoutList.innerHTML='<div class="small">Нет записей</div>';
  store.workouts.forEach(w=>{
    const div = document.createElement('div'); div.className='task';
    const info = document.createElement('div'); info.className='title';
    info.innerHTML = `<div style="font-weight:700">${w.name}</div><div class="small">${fmtDate(w.date)}</div>`;
    const meta = document.createElement('div'); meta.style.textAlign='right';
    meta.innerHTML = `<div class="small">${w.dur} мин • ${w.kcal} ккал</div><div style="height:6px"></div><button class="btn ghost" data-id="${w.id}">Удалить</button>`;
    div.appendChild(info); div.appendChild(meta);
    workoutList.appendChild(div);
  });
  workoutList.querySelectorAll('button').forEach(b=>b.addEventListener('click', (e)=>{ const id=e.target.dataset.id; store.workouts = store.workouts.filter(x=>x.id!==id); addLog('workout_del','Удалена тренировка',{id}); save(); }));
}
function workoutStreak(){
  if(store.workouts.length===0) return 0;
  const days = new Set(store.workouts.map(w=>dateOnly(w.date)));
  let streak = 0; let d = new Date(); for(;;){
    const key = d.toISOString().slice(0,10);
    if(days.has(key)){ streak++; d.setDate(d.getDate()-1); } else break;
  }
  return streak;
}

/* ===== WEIGHT ===== */
const weightsTable = document.getElementById('weightsTable');
document.getElementById('addWeight').addEventListener('click', ()=>{
  const w = Number(document.getElementById('inputWeight').value);
  const h = Number(document.getElementById('inputHeight').value) || Number(store.settings.height) || 170;
  if(!w || !h) return alert('Вес и рост');
  const bmi = Math.round((w / ((h/100)*(h/100))) * 10) / 10;
  const item = {id:uid('wt'), date:now(), weight: w, bmi};
  store.weights.unshift(item);
  store.settings.height = h;
  addLog('weight', `Вес ${w} кг`, item);
  document.getElementById('inputWeight').value='';
  save();
});
document.getElementById('clearWeights').addEventListener('click', ()=>{ if(confirm('Очистить веса?')){ store.weights=[]; addLog('weight_clear','Очистка весов'); save(); } });
function renderWeights(){
  weightsTable.innerHTML='';
  if(store.weights.length===0) weightsTable.innerHTML='<tr><td colspan="4" class="small">Нет записей</td></tr>';
  store.weights.forEach(w=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${fmtDate(w.date)}</td><td>${w.weight} кг</td><td>${w.bmi}</td><td><button class="btn ghost" data-id="${w.id}">Удалить</button></td>`;
    weightsTable.appendChild(tr);
  });
  weightsTable.querySelectorAll('button').forEach(b=>b.addEventListener('click', (e)=>{ const id=e.target.dataset.id; store.weights = store.weights.filter(x=>x.id!==id); addLog('weight_del','Удалён вес',{id}); save(); }));
  renderWeightChart();
}
function renderWeightChart(){
  const svg = document.getElementById('weightSpark');
  svg.innerHTML='';
  const data = store.weights.slice(0,30).reverse();
  if(data.length<2){ svg.innerHTML = `<text x="50%" y="50%" text-anchor="middle" fill="#9aa4b2">Нет данных</text>`; return; }
  const w = 400, h = 120, pad=10;
  const vals = data.map(d=>d.weight); const min = Math.min(...vals), max = Math.max(...vals);
  const scaleX = (i)=> pad + (i/(data.length-1))*(w-2*pad);
  const scaleY = (v)=> h - pad - ((v - min)/(max-min || 1))*(h-2*pad);
  const path = data.map((d,i)=>`${i===0?'M':'L'} ${scaleX(i)} ${scaleY(d.weight)}`).join(' ');
  const poly = document.createElementNS('http://www.w3.org/2000/svg','path');
  poly.setAttribute('d', path);
  poly.setAttribute('fill','none'); poly.setAttribute('stroke','url(#gline)'); poly.setAttribute('stroke-width','2.2');
  const defs = document.createElementNS('http://www.w3.org/2000/svg','defs');
  defs.innerHTML = `<linearGradient id="gline" x1="0" x2="1"><stop offset="0" stop-color="#2b8cff"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>`;
  svg.appendChild(defs); svg.appendChild(poly);
}

/* ===== TASKS ===== */
const taskList = document.getElementById('taskList');
document.getElementById('addTask').addEventListener('click', ()=>{
  const t = document.getElementById('taskTitle').value.trim();
  const due = document.getElementById('taskDue').value || null;
  if(!t) return;
  const item = {id:uid('t'), title:t, due, done:false, created:now()};
  store.tasks.unshift(item);
  addLog('task','Новая задача: '+t, item);
  document.getElementById('taskTitle').value=''; document.getElementById('taskDue').value='';
  save();
});
function renderTasks(){
  taskList.innerHTML='';
  const filter = document.getElementById('taskFilter').value;
  let list = store.tasks.slice();
  if(filter==='today'){ const today = new Date().toISOString().slice(0,10); list = list.filter(x=>x.due===today); }
  if(filter==='active') list = list.filter(x=>!x.done);
  if(filter==='done') list = list.filter(x=>x.done);
  if(list.length===0) taskList.innerHTML='<div class="small">Нет задач</div>';
  list.forEach(t=>{
    const div = document.createElement('div'); div.className='task';
    const cb = document.createElement('div'); cb.className='checkbox'; cb.innerHTML = t.done ? '✓' : '';
    cb.addEventListener('click', ()=>{ t.done=!t.done; addLog('task_done', t.done ? 'Выполнена: '+t.title : 'Отменено: '+t.title, t); save(); });
    const info = document.createElement('div'); info.className='title';
    info.innerHTML = `<div style="font-weight:700">${t.title}</div><div class="small">${t.due?('До '+t.due):''}</div>`;
    const actions = document.createElement('div'); actions.innerHTML = `<button class="btn ghost" data-id="${t.id}">Удалить</button>`;
    div.appendChild(cb); div.appendChild(info); div.appendChild(actions);
    taskList.appendChild(div);
  });
  taskList.querySelectorAll('button').forEach(b=>b.addEventListener('click', (e)=>{ const id=e.target.dataset.id; store.tasks = store.tasks.filter(x=>x.id!==id); addLog('task_del','Удалена задача',{id}); save(); }));
}
document.getElementById('taskFilter').addEventListener('change', renderTasks);

/* ===== FINANCES ===== */
const financeCols = document.getElementById('financeCols');
const txnTable = document.getElementById('txnTable');
document.getElementById('addTxn').addEventListener('click', ()=>{
  const type = document.getElementById('txnType').value;
  const amount = Number(document.getElementById('txnAmount').value) || 0;
  const note = document.getElementById('txnNote').value.trim();
  if(!amount) return alert('Сумма');
  const item = {id:uid('tx'), type, amount, note, date:now()};
  store.txns.unshift(item);
  addLog('txn', `${type==='income'?'Доход':'Расход'} ${amount} ₽ ${note}`, item);
  document.getElementById('txnAmount').value=''; document.getElementById('txnNote').value='';
  save();
});
document.getElementById('setGoal').addEventListener('click', ()=>{
  const v = Number(document.getElementById('goalMonthly').value) || 0; store.settings.goalMonthly = v; addLog('goal','Цель сохранена '+v); save();
});
function renderFinances(){
  financeCols.innerHTML='';
  const days = [];
  for(let i=29;i>=0;i--){ const d = new Date(); d.setDate(d.getDate()-i); days.push(dateOnly(d.getTime())); }
  const sums = days.map(d=>store.txns.filter(t=>dateOnly(t.date)===d).reduce((s,t)=> s + (t.type==='income'?t.amount:-t.amount),0));
  const max = Math.max(...sums.map(Math.abs), 1);
  days.forEach((d,i)=>{
    const col = document.createElement('div'); col.className='col';
    const val = sums[i]; const h = Math.abs(val)/max*100;
    const fill = document.createElement('div'); fill.className='fill'; fill.style.height = (h? h:3) + '%';
    if(val<0) fill.style.background = 'linear-gradient(180deg,#ff9b9b,#ff6b6b)';
    if(val>0) fill.style.background = 'linear-gradient(180deg,var(--accent),var(--accent2))';
    col.appendChild(fill);
    const lbl = document.createElement('div'); lbl.className='label'; lbl.textContent = `${new Date(d).getDate()}`; col.appendChild(lbl);
    col.addEventListener('click', ()=>{ alert(`${d}\nСумма: ${val} ₽`); });
    financeCols.appendChild(col);
  });
  const balance = store.txns.reduce((s,t)=> s + (t.type==='income'?t.amount:-t.amount),0);
  document.getElementById('balance').textContent = balance.toLocaleString('ru-RU') + ' ₽';
  document.getElementById('finSummary').textContent = [
    (store.txns.filter(t=>dateOnly(t.date)===dateOnly(now())).reduce((s,t)=>s+(t.type==='income'?t.amount:-t.amount),0)).toLocaleString('ru-RU')+' ₽',
    (store.txns.filter(t=>{ const d = new Date(t.date); const nowd = new Date(); const start = new Date(nowd.getFullYear(),nowd.getMonth(), nowd.getDate()-6); return d>=start; }).reduce((s,t)=>s+(t.type==='income'?t.amount:-t.amount),0)).toLocaleString('ru-RU')+' ₽',
    (store.txns.filter(t=> new Date(t.date).getMonth()=== new Date().getMonth() && new Date(t.date).getFullYear()=== new Date().getFullYear()).reduce((s,t)=>s+(t.type==='income'?t.amount:-t.amount),0)).toLocaleString('ru-RU')+' ₽'
  ].join(' / ');
  txnTable.innerHTML='';
  if(store.txns.length===0) txnTable.innerHTML='<tr><td colspan="4" class="small">Нет операций</td></tr>';
  store.txns.slice(0,100).forEach(t=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${fmtDate(t.date)}</td><td>${t.type}</td><td style="font-weight:700">${(t.type==='income'?'+':'-')}${t.amount} ₽</td><td>${t.note||''}</td>`;
    txnTable.appendChild(tr);
  });
}

/* ===== HISTORY ===== */
function renderTimeline(){
  const timeline = document.getElementById('timeline'); timeline.innerHTML='';
  if(store.logs.length===0) timeline.innerHTML='<div class="small">Нет действий</div>';
  store.logs.slice(0,200).forEach(e=>{
    const ev = document.createElement('div'); ev.className='event';
    ev.innerHTML = `<div class="time">${new Date(e.t).toLocaleString()}</div><div style="flex:1"><div style="font-weight:700">${e.type}</div><div class="small">${e.text}</div></div>`;
    timeline.appendChild(ev);
  });
}

/* ===== EXPORT / IMPORT / RESET ===== */
document.getElementById('btnExport').addEventListener('click', ()=>{
  const blob = new Blob([JSON.stringify(store)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download = `tapki-backup-${new Date().toISOString().slice(0,10)}.json`; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
});
document.getElementById('btnImport').addEventListener('click', ()=> document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change', (e)=>{
  const f = e.target.files && e.target.files[0]; if(!f) return;
  const r = new FileReader(); r.onload = ()=>{ try{ const obj = JSON.parse(r.result); if(confirm('Импортировать и перезаписать данные?')){ store = obj; save(); alert('Импортировано'); } }catch(err){ alert('Ошибка файла'); } }; r.readAsText(f);
});
document.getElementById('btnReset').addEventListener('click', ()=>{ if(confirm('Полный сброс?')){ localStorage.removeItem(STORE_KEY); location.reload(); } });

/* ===== RENDER ALL ===== */
function renderAll(){
  renderWorkouts(); renderWeights(); renderTasks(); renderFinances(); renderTimeline();
  document.getElementById('subtitle').textContent = `v2 • ${store.workouts.length} трен • ${store.tasks.filter(t=>!t.done).length} задач`;
  document.getElementById('workout-streak').textContent = workoutStreak();
  if(store.settings.iconData) applyLogo(store.settings.iconData);
  document.getElementById('goalMonthly').value = store.settings.goalMonthly || '';
}

/* ===== INIT ===== */
function init(){
  load();
  renderAll();
  // show splash 3 seconds, then app
  setTimeout(()=>{ splash.style.display='none'; app.style.display=''; }, 3000);
  // try to register small service worker blob (best-effort, Safari may ignore)
  if('serviceWorker' in navigator){
    try{
      const swCode = `self.addEventListener('install', e=>self.skipWaiting());self.addEventListener('fetch', e=>{ e.respondWith(fetch(e.request).catch(()=>caches.match(e.request))); });`;
      const blob = new Blob([swCode], {type:'application/javascript'}); const swUrl = URL.createObjectURL(blob);
      navigator.serviceWorker.register(swUrl).catch(()=>{});
    }catch(e){}
  }
}
init();

/* ===== KEYBOARD SHORTCUTS — исправлено ===== */
/* Теперь горячие клавиши для переключения вкладок работают ТОЛЬКО если:
   - фокус НЕ в input/textarea/select OR
   - если нажат Ctrl / Meta (чтобы можно было принудительно)
*/
function isTypingElement(el){
  if(!el) return false;
  const t = el.tagName;
  if(t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') return true;
  if(el.isContentEditable) return true;
  return false;
}
document.addEventListener('keydown', (e)=>{
  // ignore if modifier keys used (allow browser combos)
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  // if focus in typing element — do nothing
  if(isTypingElement(document.activeElement)) return;
  // only digits 1..5 map to tabs
  const map = {'1':'history','2':'workouts','3':'weight','4':'tasks','5':'finances'};
  if(e.key && map[e.key]){
    const tab = document.querySelector(`.tab[data-tab="${map[e.key]}"]`);
    if(tab) tab.click();
  }
});

/* ===== Keyboard helper: small toggle for today via 't' but only when not typing ===== */
document.addEventListener('keydown', (e)=>{
  if(e.key.toLowerCase()==='t' && !isTypingElement(document.activeElement)){
    const nowd = new Date();
    // toggle today's workout mark: find first workout with today's date? we'll toggle today's task completion if exists
    const today = new Date().toISOString().slice(0,10);
    // try toggle first task due today
    const t = store.tasks.find(x=>x.due===today);
    if(t){ t.done = !t.done; addLog('task_done', t.done ? 'Выполнена: '+t.title : 'Отменено: '+t.title, t); save(); }
  }
});
</script>
